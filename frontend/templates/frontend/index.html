{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <script>try{var t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <title>Reconcile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'frontend/app.css' %}">
</head>
<body>
  <div id="toasts" aria-live="polite"></div>

  <main id="login" class="login hidden">
    <form id="login-form" class="login-card stack">
      <div>
        <h1>Reconcile</h1>
        <p class="sub">Sign in to review transactions.</p>
      </div>
      <label>Username <input name="username" autocomplete="username" required></label>
      <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn" type="submit">Sign in</button>
    </form>
  </main>

  <div id="app" class="hidden">
        <header class="topbar">
      <div class="brand">Reconcile</div>
      <nav>
        <a class="tab" data-view="imports" href="#/imports">Imports</a>
        <a class="tab" data-view="runs" href="#/runs">Runs</a>
        <a class="tab" data-view="review" href="#/review">Review queue</a>
        <a class="tab hidden" id="users-tab" data-view="users" href="#/users">Users</a>
      </nav>
      <div class="user">
        <span id="whoami"></span>
        <button id="theme" class="btn ghost sm" type="button"></button>
        <button id="logout" class="btn ghost sm" type="button">Sign out</button>
      </div>
    </header>
    <section id="view" class="view"></section>
    <footer class="footer">
      <div class="footer-inner">
        <span>Reconcile · anomalies are prompts to investigate, not verdicts.</span>
        <button class="link-quiet" type="button" data-guide>CSV format guide</button>
      </div>
    </footer>
  </div>

  <div id="overlay" class="overlay"></div>
  <aside id="drawer" class="drawer" aria-hidden="true"></aside>

  <script src="{% static 'frontend/app.js' %}" defer></script>
</body>
</html>
